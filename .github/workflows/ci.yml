name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.11

      - name: Install dependencies
        run: |
          uv pip install "fastapi[standard]" prometheus-client motor torch transformers \
            aiohttp pytest pytest-asyncio httpx pytest-cov pyyaml \
            "presidio-analyzer[transformers]" presidio-anonymizer rapidfuzz \
            openai google-generativeai anthropic ruff mypy black
          uv run python -m spacy download en_core_web_sm

      - name: Lint
        run: |
          uv run ruff check src tests evals
          uv run black --check src tests evals

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing
